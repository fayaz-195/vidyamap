name: Website quality checks

on:
  push:
    branches: [main, audit/website-quality-fixes]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML structure and inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const assert = (condition, message) => {
            if (!condition) {
              console.error('FAIL:', message);
              process.exitCode = 1;
            } else {
              console.log('PASS:', message);
            }
          };
          assert(/<!doctype html/i.test(html), 'doctype exists');
          assert(/<html\b/i.test(html) && /<\/html>\s*$/i.test(html), 'HTML root is closed');
          assert(/name=["']viewport["']/i.test(html), 'responsive viewport is configured');
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m => m[1]);
          const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
          assert(duplicates.length === 0, 'HTML IDs are unique' + (duplicates.length ? ': ' + [...new Set(duplicates)].join(', ') : ''));
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          assert(scripts.length > 0, 'inline scripts are present');
          assert((html.match(/<script\b/gi) || []).length === scripts.length, 'all script tags are closed');
          scripts.forEach((match, index) => {
            const code = match[1].trim();
            if (!code) return;
            try {
              new vm.Script(code, { filename: 'inline-script-' + (index + 1) + '.js' });
              console.log('PASS: inline JavaScript syntax #' + (index + 1));
            } catch (error) {
              console.error('FAIL: inline JavaScript syntax #' + (index + 1) + ':', error.message);
              process.exitCode = 1;
            }
          });
          NODE
