name: Website quality checks

on:
  push:
    branches: [main, audit/website-quality-fixes]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate every public HTML page and inline JavaScript
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const pages = fs.readdirSync('.').filter(name => name.endsWith('.html')).sort();
          let failures = 0;
          const check = (condition, message) => {
            if (!condition) {
              console.error('FAIL:', message);
              failures++;
            } else {
              console.log('PASS:', message);
            }
          };
          check(pages.length >= 1, 'HTML pages discovered');
          for (const file of pages) {
            const html = fs.readFileSync(file, 'utf8');
            const label = file + ': ';
            check(/<!doctype html/i.test(html), label + 'doctype exists');
            check(/<html\b/i.test(html) && /<\/html>\s*$/i.test(html), label + 'HTML root is closed');
            check(/name=["']viewport["']/i.test(html), label + 'responsive viewport is configured');
            const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
            const duplicates = [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))];
            check(duplicates.length === 0, label + 'IDs are unique' + (duplicates.length ? ': ' + duplicates.join(', ') : ''));
            const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
            check((html.match(/<script\b/gi) || []).length === scripts.length, label + 'all script tags are closed');
            scripts.forEach((match, index) => {
              const code = match[1].trim();
              if (!code) return;
              try {
                new vm.Script(code, { filename: file + ':inline-script-' + (index + 1) + '.js' });
                console.log('PASS:', label + 'inline JavaScript syntax #' + (index + 1));
              } catch (error) {
                console.error('FAIL:', label + 'inline JavaScript syntax #' + (index + 1) + ': ' + error.message);
                failures++;
              }
            });
          }
          if (failures) {
            console.error('Static checks failed:', failures);
            process.exit(1);
          }
          console.log('All static checks passed for ' + pages.length + ' HTML pages.');
          NODE
