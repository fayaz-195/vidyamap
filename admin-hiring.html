<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hiring Moderation | VidyaMap Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fb;color:#1b2942;font:14px/1.5 Arial,sans-serif}.wrap{width:min(1100px,94%);margin:30px auto}.panel{background:white;border:1px solid #e1e5ef;border-radius:16px;padding:20px;margin:16px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #edf0f5;padding:14px 0}.row:last-child{border:0}.muted{color:#68758b}.btn{border:0;border-radius:9px;padding:9px 13px;background:#6328a4;color:white;font-weight:700;cursor:pointer;margin:3px}.btn.alt{background:#edf0f7;color:#233650}.btn.reject{background:#a83248}.notice{padding:12px;background:#eef3ff;border-radius:10px;margin:10px 0}h1,h2{color:#17365d}</style></head><body><main class="wrap"><a href="./admin.html">← Back to Admin Panel</a><h1>Jobs & Hiring Moderation</h1><p class="muted">Verify employer accounts and approve or reject job listings before they appear publicly.</p><div id="notice" class="notice">Checking admin permissions…</div><section class="panel"><h2>Employer verification requests</h2><div id="companies"></div></section><section class="panel"><h2>Jobs awaiting approval</h2><div id="jobs"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://taxlvccrinehasexgvhv.supabase.co","sb_publishable_mrT2M6uwRzH2ExfZh7tevg_zdfd0pyA"),$=id=>document.getElementById(id);
function row(container,title,sub,actions){const d=document.createElement('div');d.className='row';const info=document.createElement('div');const b=document.createElement('b');b.textContent=title;const p=document.createElement('div');p.className='muted';p.textContent=sub;info.append(b,p);const tools=document.createElement('div');actions.forEach(a=>{const x=document.createElement('button');x.className='btn '+(a.alt||'');x.textContent=a.label;x.onclick=a.run;tools.append(x)});d.append(info,tools);container.append(d)}
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){$('notice').textContent='Please sign in to the VidyaMap admin account first.';return}const {data:p,error}=await db.from('profiles').select('role,is_active,is_founder').eq('id',user.id).maybeSingle();if(error||!p||!p.is_active||!(p.is_founder||p.role==='platform_admin')){$('notice').textContent='Access denied. This page is restricted to active VidyaMap platform admins.';return}$('notice').textContent='Admin access verified.';await Promise.all([loadCompanies(),loadJobs()])}
async function loadCompanies(){const {data,error}=await db.from('hiring_companies').select('*').eq('verification_status','pending').order('created_at');if(error){$('companies').textContent=error.message;return}$('companies').replaceChildren();if(!data?.length){$('companies').textContent='No pending company requests.';return}data.forEach(c=>row($('companies'),c.company_name,[c.industry,c.contact_name,c.contact_email,c.contact_phone,c.website_url].filter(Boolean).join(' · '),[{label:'Verify',run:()=>companyStatus(c.id,'verified')},{label:'Reject',alt:'reject',run:()=>companyStatus(c.id,'rejected')}]))}
async function companyStatus(id,status){const {error}=await db.from('hiring_companies').update({verification_status:status}).eq('id',id);if(error){alert(error.message);return}await loadCompanies()}
async function loadJobs(){const {data,error}=await db.from('hiring_jobs').select('id,title,location,qualification,employment_type,description,application_deadline,created_at,hiring_companies(company_name,verification_status)').eq('status','pending').order('created_at');if(error){$('jobs').textContent=error.message;return}$('jobs').replaceChildren();if(!data?.length){$('jobs').textContent='No jobs awaiting approval.';return}data.forEach(j=>row($('jobs'),j.title+' — '+(j.hiring_companies?.company_name||'Employer'),[j.location,j.qualification,j.employment_type,j.application_deadline?'Deadline: '+j.application_deadline:'',j.description].filter(Boolean).join(' · '),[{label:'Approve',run:()=>jobStatus(j.id,'approved')},{label:'Reject',alt:'reject',run:()=>jobStatus(j.id,'rejected')}]))}
async function jobStatus(id,status){const {error}=await db.from('hiring_jobs').update({status,approved_at:status==='approved'?new Date().toISOString():null,approved_by:(await db.auth.getUser()).data.user.id}).eq('id',id);if(error){alert(error.message);return}await loadJobs()}
init();
</script></body></html>
